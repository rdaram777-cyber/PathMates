<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="PathMates">
  <!--
    PathMates brand mark — a clean, bold geometric "P".
    A solid navy P (thick vertical stem + rounded bowl) with a clear rounded
    counter (the negative space inside the bowl). A small orange right-pointing
    arrowhead sits inside the counter — the subtle "path ahead / moving
    forward" motif — without ever obscuring the letter, so the P reads clearly
    at both favicon and OG sizes.

    P body: navy #071B3A (draws a single filled silhouette; the counter is a
    second sub-path cut out via even-odd fill rule). Arrowhead: orange #FF7A3D
    (fixed accent).

    The React <LogoMark/> component uses fill="currentColor" for the P so it
    inherits the surrounding text color on light AND dark backgrounds, while
    the arrowhead stays the fixed brand orange.
  -->
  <path
    d="M 13 57 L 13 7 L 52 7 A 6 6 0 0 1 58 13 L 58 29 A 6 6 0 0 1 52 35 L 26 35 L 26 57 Z
       M 32 14 L 45 14 A 5 5 0 0 1 50 19 L 50 25 A 5 5 0 0 1 45 30 L 32 30 Z"
    fill="#071B3A" fill-rule="evenodd"
  />
  <path
    d="M 38.5 18.5 L 43.5 18.5 L 43.5 15 L 48.5 20 L 43.5 25 L 43.5 21.5 L 38.5 21.5 Z"
    fill="#FF7A3D"
  />
</svg>
