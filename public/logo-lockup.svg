<svg xmlns="http://www.w3.org/2000/svg" width="166" height="24" viewBox="0 0 166 24" role="img" aria-label="PathMates">
  <!--
    PathMates logo lockup — brand mark + "PathMates" wordmark.
    Fixed navy/orange version (for static contexts like docs, emails, OG).
    The app navbar renders the adaptive React version (mark inherits
    currentColor, "Path" in --text, "Mates" in --accent).
  -->
  <g transform="translate(0,0) scale(0.375)">
    <path
      d="M 20 54 L 20 20 C 20 10, 44 8, 44 24 C 44 37, 38 45, 29 44"
      fill="none" stroke="#071B3A" stroke-width="7.5"
      stroke-linecap="round" stroke-linejoin="round"
    />
    <path d="M 40 33 L 23 43 L 30.2 43.2 L 34 47 Z" fill="#FF7A3D"/>
  </g>
  <text
    x="36" y="21"
    font-family="Inter, 'Inter Fallback', Arial, sans-serif"
    font-weight="800" font-size="24"
    fill="#071B3A"
  >Path<tspan fill="#FF7A3D">Mates</tspan></text>
</svg>
